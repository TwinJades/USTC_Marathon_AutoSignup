[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-marathon-autosignup"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
description = "科大马拉松监测与自动报名程序"
dependencies = [
  "playwright==1.63.0",
  "pydantic==2.14.0",
  "tomlkit==0.15.1",
  "questionary==2.1.1",
  "keyring==25.7.0",
]

[project.scripts]
ustc-marathon = "ustc_marathon.cli:main"

[tool.setuptools.packages.find]
include = ["ustc_marathon*"]

[tool.setuptools.package-data]
ustc_marathon = ["*.js"]
