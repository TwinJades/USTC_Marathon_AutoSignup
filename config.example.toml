# 运行 select 命令后自动写入目标比赛。数组顺序就是优先顺序。
targets = []

# 登录账号与程序运行设置。密码通过 credentials set 命令输入。
[monitor]
username = ""
poll_interval_seconds = 30.0
request_timeout_seconds = 30.0
login_timeout_seconds = 600.0
# 登录时始终显示浏览器。监测时默认在后台运行。
headless = true

# 第一步保留网站预填的院系和班级，两个步骤共用下面的 phone。
[profile]
depart_name = ""
user_type = "学生"
sex = ""
size = ""
id_number = ""
phone = ""
emergency_contact = ""
