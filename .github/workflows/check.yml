name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Build and test release
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check CLI
        run: ./release/ustc-marathon.exe --help
      - name: Verify extracted release and uninstall
        shell: pwsh
        run: ./scripts/verify-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/packages/*
