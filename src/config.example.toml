# 运行 select 命令后自动写入目标比赛。数组顺序就是优先顺序。
targets = []

# 首次使用时由本人选择，程序保存 chrome 或 edge。
[browser]
kind = ""
# 非标准安装位置可以填写浏览器 EXE 的完整路径。
executable_path = ""

# 登录后保存账号，密码通过登录操作验证后保存到 Windows 凭据管理器。
[monitor]
username = ""
poll_interval_seconds = 30.0
request_timeout_seconds = 30.0
login_timeout_seconds = 600.0
# 登录时始终显示浏览器。监测时默认在后台运行。
headless = true

# 院系与性别由网站预填，登录后自动保存，无需本人填写。
# 第一步保留网站预填的院系和班级，两个步骤共用下面的 phone。
[profile]
depart_name = ""
user_type = "学生"
sex = ""
size = ""
id_number = ""
phone = ""
emergency_contact = ""
